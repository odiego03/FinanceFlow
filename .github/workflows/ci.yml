name: CI

# Roda a cada push e a cada pull request para main ou develop.
# O deploy não está aqui: o Render (backend) e a Vercel (frontend) publicam sozinhos a partir da main.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Um push novo na mesma branch cancela a execução anterior ainda em andamento
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # Java 17: o mesmo da imagem Docker do backend
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # Testes de unidade e de integração (H2 em memória, com as mesmas migrações Flyway de produção)
      - name: Testes
        run: mvn -B test

  frontend:
    name: Frontend (lint e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Node 20: o mesmo da imagem Docker do frontend
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
