services:
  backend:
    build:
      context: ./backend
    container_name: financeflow-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PGHOST: ${PGHOST}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE}
      PGUSER: ${PGUSER}
      PGPASSWORD: ${PGPASSWORD}
      JWT_SECRET: ${JWT_SECRET}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    container_name: financeflow-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
