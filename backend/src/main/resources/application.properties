spring.application.name=financeflow-backend
# O Render informa a porta em PORT; local e no Docker fica a 8080
server.port=${PORT:8080}

spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:financeflow}?sslmode=${PGSSLMODE:require}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}

# O esquema é das migrações do Flyway (db/migration); o Hibernate só confere se as entidades batem com ele.
# baseline-on-migrate: num banco que já tinha as tabelas (criadas pelo antigo ddl-auto=update), marca a V1 como
# aplicada em vez de tentar criar tudo de novo
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Sem valor padrão de propósito: com uma chave fixa no código, qualquer um conseguiria forjar um token.
# Local: jwt.chave-secreta no application-local.properties. Docker: JWT_SECRET no .env
jwt.chave-secreta=${JWT_SECRET}
jwt.expiracao-ms=28800000

# Endereço do frontend: o botão do e-mail de confirmação de conta aponta pra ele (<url>/confirmar-conta?token=...).
# Em produção, a URL da Vercel; no docker-compose, http://localhost:3000
app.url-frontend=${FRONTEND_URL:http://localhost:5173}

# Separadas por vírgula; em produção, a URL do frontend
cors.origens-permitidas=${CORS_ORIGENS:http://localhost:5173,http://localhost:4173,http://localhost:3000}

management.endpoints.web.exposure.include=health
# O SMTP fica fora do health: e-mail fora do ar não deve derrubar o healthcheck do Docker
management.health.mail.enabled=false

# SMTP do "esqueci minha senha" (ex: Gmail = smtp.gmail.com, porta 587, senha de app). Sem MAIL_HOST o código
# vai pro log do backend, só pra rodar localmente
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORTA:587}
spring.mail.username=${MAIL_USUARIO:}
spring.mail.password=${MAIL_SENHA:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
email.remetente=${MAIL_REMETENTE:${MAIL_USUARIO:}}
# API HTTP do Brevo: no Render grátis as portas de SMTP são bloqueadas, então lá o e-mail sai por aqui
email.brevo-api-key=${BREVO_API_KEY:}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
