# Banco em memória no modo PostgreSQL; o Flyway roda as mesmas migrações de produção e o Hibernate valida o esquema
spring.datasource.url=jdbc:h2:mem:financeflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
jwt.chave-secreta=chave-dos-testes-com-pelo-menos-32-caracteres
